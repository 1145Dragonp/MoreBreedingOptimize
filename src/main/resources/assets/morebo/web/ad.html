<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>广告时间</title>
<style>
body { background:#1a1a2e; color:#eee; font-family:sans-serif; text-align:center; padding:20px; }
iframe { width:800px; height:450px; border:none; }
#status { font-size:24px; margin-top:20px; color:#ffcc00; }
#answer { font-size:32px; color:#00ff88; display:none; margin-top:20px; }
</style>
</head>
<body>
<h2>看完广告获得答案</h2>
<iframe src="https://player.bilibili.com/player.html?bvid=BV1UT42167xb&autoplay=1" allowfullscreen></iframe>
<div id="status">广告播放中... 剩余 <span id="countdown">15</span> 秒</div>
<div id="answer">答案是 C，回游戏选 C 即可！</div>
<script>
var s=15;
var t=setInterval(function(){
    s--;
    document.getElementById('countdown').textContent=s;
    if(s<=0){
        clearInterval(t);
        document.getElementById('status').style.display='none';
        document.getElementById('answer').style.display='block';
    }
},1000);
</script>
</body>
</html>
